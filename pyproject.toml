[project]
name = "speech-voiceprint"
version = "0.1.0"
description = "Azure Speech STT + open-source voiceprint speaker enhancement"
requires-python = ">=3.11"
dependencies = [
    "azure-cognitiveservices-speech>=1.40.0",
    "requests>=2.32",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "click>=8.1",
    "websockets>=14",
    "sounddevice>=0.4",
    "pydantic>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
pyannote = [
    "pyannote.audio>=3.3",
    "torch>=2.2",
    "torchaudio>=2.2",
    "huggingface_hub>=0.24",
]
speechbrain = [
    "speechbrain>=1.0",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "torchaudio>=2.2",
]
mysql = [
    "pymysql>=1.1",
    "cryptography>=42",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
speech-voiceprint = "pipeline.orchestrator:main"
speech-voiceprint-api = "pipeline.api:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["stt", "voiceprint", "merger", "registry", "pipeline", "schemas"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
