apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml          # template — replace before applying or use a sealed-secrets equivalent
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Override image at deploy time:
#   kustomize edit set image speech-voiceprint=myregistry.azurecr.io/speech-voiceprint:v0.1.0
images:
  - name: ghcr.io/example/speech-voiceprint
    newTag: latest
