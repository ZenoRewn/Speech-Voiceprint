# Template — DO NOT commit real secrets. Apply via:
#   kubectl create secret generic sv-secrets -n speech-voiceprint \
#     --from-literal=AZURE_SPEECH_KEY=... \
#     --from-literal=HF_TOKEN=hf_... \
#     --from-literal=SV_API_TOKEN=$(openssl rand -hex 32)
#
# Or use sealed-secrets / external-secrets / Azure Key Vault CSI driver — the
# Deployment only needs `sv-secrets` to exist with these three keys.
apiVersion: v1
kind: Secret
metadata:
  name: sv-secrets
  namespace: speech-voiceprint
type: Opaque
stringData:
  AZURE_SPEECH_KEY: "REPLACE_ME"
  HF_TOKEN: ""               # only needed for the pyannote backend
  # Optional: set to mysql+pymysql://user:password@host:3306/db to store the
  # speaker/voiceprint registry in MySQL instead of /data/registry/speakers.db.
  # Keep it in Secret because the URI contains credentials.
  # SV_REGISTRY_PATH: "mysql+pymysql://user:password@mysql-host:3306/speech_voiceprint"
  # SV_API_TOKEN gates every REST + WS route. When you deploy behind an
  # authenticated ingress (Azure AD / API Management / oauth2-proxy) you
  # probably still want this set as defense-in-depth: the gateway adds an
  # internal-only header `Authorization: Bearer <SV_API_TOKEN>` so even if
  # someone reaches the pod IP directly, they can't talk to the API.
  SV_API_TOKEN: "REPLACE_ME_WITH_LONG_RANDOM_STRING"
